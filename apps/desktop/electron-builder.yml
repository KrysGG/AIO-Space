appId: com.spaceaio.app
productName: SpaceAIO
copyright: Copyright (c) 2026 Christian Giraudo. All rights reserved.
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
# Electron fuses (ROADMAP 3.7, docs/SECURITY.md).
afterPack: scripts/afterPack.cjs
linux:
  executableName: spaceaio
  # File names without spaces (release URLs, AUR sources); the app itself is "SpaceAIO".
  artifactName: spaceaio-${version}-${arch}.${ext}
  # Wayland app_id / WM_CLASS = spaceaio, matching spaceaio.desktop, so the window gets its icon.
  syncDesktopName: true
  target:
    - AppImage
    - pacman
    # The app folder alone, for the AUR's spaceaio-bin (packaging/aur, ROADMAP 5.2).
    - tar.gz
  category: Network
  maintainer: SpaceAIO
  icon: build/icons
  synopsis: All-in-one tiled workspace for web apps
  description: Web apps side by side in resizable tiles, each with its own login, with ad and tracker blocking.
  desktop:
    entry:
      Name: SpaceAIO
      GenericName: Web app workspace
      Comment: Web apps side by side in resizable tiles, with separate logins
      Keywords: discord;youtube;twitch;tiles;workspace;browser;
      StartupWMClass: spaceaio
pacman:
  packageName: spaceaio
  # Electron bundles ffmpeg and friends; electron-builder's default list names packages Arch no
  # longer has (libappindicator-gtk3), which would make `pacman -U` fail.
  depends: [gtk3, nss, alsa-lib, libxss, libxtst, libnotify, libsecret, at-spi2-core, xdg-utils]
win:
  target: nsis
# Where releases live (ROADMAP 5.4/5.5): electron-builder writes latest-linux.yml and the app's
# update config from this. It never uploads anything itself (`--publish never`); the release workflow does.
publish:
  provider: github
  owner: KrysGG
  repo: SpaceAIO
