name: Release

# ROADMAP 5.5 / 6.5 (D-060, D-063). Pushing a tag like v0.1.0 builds and checks Linux and Windows, then
# publishes one GitHub release with: the AppImage, pacman package and tar.gz (for the AUR), the Windows
# installer, SHA256SUMS, latest-linux.yml / latest.yml (for the updaters) and the updated AUR files.
# "Run workflow" by hand does everything except publishing: the files are kept as workflow artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Tag matches the app version
        id: version
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match apps/desktop/package.json version $version. Bump the version, commit, and tag v$version."
            exit 1
          fi

      - run: pnpm typecheck
      # Ubuntu 24.04 blocks the unprivileged user namespaces Electron's sandbox needs.
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test
      - if: runner.os == 'Windows'
        run: pnpm test
      - run: pnpm lint

      # bsdtar is used by electron-builder's pacman target.
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends libarchive-tools
      - if: runner.os == 'Linux'
        run: pnpm dist:linux
      - if: runner.os == 'Windows'
        run: pnpm --filter @aio/desktop dist:win
      - name: Check the release files (fuses, app.asar)
        run: pnpm --filter @aio/desktop verify:release

      # What a user does (ROADMAP 6.4): install, start, uninstall. Silent, per-user, no admin.
      - name: Install, start and uninstall the Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: apps/desktop/release
        run: |
          $setup = (Get-ChildItem spaceaio-*-setup.exe | Select-Object -First 1).FullName
          Start-Process $setup -ArgumentList '/S' -Wait
          $found = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Filter SpaceAIO.exe -Recurse -Depth 1 -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $found) { throw "SpaceAIO.exe not found under $env:LOCALAPPDATA\Programs after installing" }
          $exe = $found.FullName
          $dir = $found.DirectoryName
          Write-Host "Installed to $dir"
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\SpaceAIO.lnk")) { throw 'No Start menu shortcut' }
          $profileDir = Join-Path $env:RUNNER_TEMP 'spaceaio-profile'
          $env:AIO_USER_DATA_DIR = $profileDir
          $app = Start-Process $exe -PassThru
          Start-Sleep -Seconds 20
          if ($app.HasExited) { throw "SpaceAIO exited early (code $($app.ExitCode))" }
          if (-not (Test-Path "$profileDir\Local State")) { throw 'SpaceAIO started but created no profile' }
          Write-Host "Installed app ran for 20 s and created its profile."
          taskkill /PID $app.Id /T /F | Out-Null
          Start-Sleep -Seconds 3
          Start-Process "$dir\Uninstall SpaceAIO.exe" -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 5
          if (Test-Path $exe) { throw 'Uninstalling left SpaceAIO.exe behind' }
          Write-Host 'Uninstalled cleanly.'

      - name: AUR files
        if: runner.os == 'Linux'
        working-directory: apps/desktop/release
        run: |
          v=${{ steps.version.outputs.version }}
          node ../../../packaging/aur/update.cjs "$v" "spaceaio-$v-x64.tar.gz" ../build/icon.svg ../../../LICENSE aur
          cp aur/PKGBUILD PKGBUILD && cp aur/.SRCINFO SRCINFO

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          retention-days: 7
          if-no-files-found: error
          path: |
            apps/desktop/release/spaceaio-*
            apps/desktop/release/latest*.yml
            apps/desktop/release/PKGBUILD
            apps/desktop/release/SRCINFO

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Checksums and release
        working-directory: files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${GITHUB_REF_NAME#v}
          sha256sum spaceaio-* > SHA256SUMS
          cat SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "SpaceAIO $v" \
            --generate-notes \
            spaceaio-* latest-linux.yml latest.yml SHA256SUMS PKGBUILD SRCINFO
