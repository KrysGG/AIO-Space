name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {} # run on any branch by hand (e.g. before merging platform work)

permissions:
  contents: read

jobs:
  check:
    # Linux is the main platform; Windows since ROADMAP 6.5 (the Electron tests run on its desktop).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Ubuntu 24.04 blocks the unprivileged user namespaces Electron's sandbox needs.
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The desktop smoke test launches Electron, which needs a display (Windows runners have one).
      - if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test
      - if: runner.os == 'Windows'
        run: pnpm test
        env:
          SMOKE_SCREENSHOT_DIR: ${{ runner.temp }}
      - if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-screenshots
          retention-days: 7
          path: ${{ runner.temp }}/window-*.png
          if-no-files-found: ignore
      - run: pnpm lint
